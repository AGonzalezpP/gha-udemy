name: 11a-[llamado] - Ejemplo Reutilizable.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  tirada-dados:
    uses: ./.github/workflows/11a-llamado.yml
    with:
      numero-dados: uno
  resumen:
    runs-on: ubuntu-latest
    needs: tirada-dados
    steps:
      - name: Escribir resumen
        run: |
          echo "# :game_die: El resultado de la tirada es:" >> $GITHUB_STEP_SUMMARY
          echo "Dado 1: ${{ needs.tirada-dados.outputs.dado1 }}" >> $GITHUB_STEP_SUMMARY
      - name: Escribir resumen con dos dados
        if: ${{ needs.tirada-dados.outputs.dado2 }}
        run: |    
          echo "Dado 2: ${{ needs.tirada-dados.outputs.dado2 }}" >> $GITHUB_STEP_SUMMARY